name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v; defaults to VERSION"
        required: false
        type: string
      refresh_existing_release:
        description: "Refresh notes and assets when the Release already exists"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile reference helpers
        run: python -m compileall -q scripts

      - name: Verify release metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = Path("VERSION").read_text(encoding="utf-8").strip()
          assert expected, "VERSION is empty"

          manifest = json.loads(Path("PACKAGE_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["version"] == expected, (manifest["version"], expected)

          for filename in ["README.md", "README.zh-CN.md", "CHANGELOG.md", "VERSIONING.md"]:
              text = Path(filename).read_text(encoding="utf-8")
              assert expected in text, f"{filename} does not reference {expected}"

          active_files = [
              "scripts/init_workspace.py",
              "scripts/validate_workspace.py",
              "scripts/install_app_package.py",
              "scripts/ano_host.py",
              "scripts/context_vm.py",
          ]
          for filename in active_files:
              text = Path(filename).read_text(encoding="utf-8")
              assert expected in text, f"{filename} does not reference {expected}"

          packages = manifest.get("bundled_app_packages", [])
          assert packages, "No bundled App packages declared"
          for package in packages:
              path = Path(package["path"])
              assert path.is_file(), f"Missing release asset: {path}"
          PY

      - name: Initialize and validate a fresh workspace
        run: |
          REPO_ROOT="$GITHUB_WORKSPACE"
          EXPECTED="$(tr -d '\r\n ' < "$REPO_ROOT/VERSION")"
          WORKSPACE="$(mktemp -d)"
          cd "$WORKSPACE"

          python "$REPO_ROOT/scripts/init_workspace.py"
          test "$(cat ano/VERSION)" = "$EXPECTED"

          python ano/scripts/validate_workspace.py
          python ano/scripts/context_vm.py status
          python ano/scripts/context_vm.py validate
          python ano/scripts/list_app_packages.py
          python ano/scripts/install_app_package.py \
            apps/_inbox/official/ano-calculator-skill-app_v0.1.2.zip
          python ano/scripts/ano_host.py "列出应用"

          test -f apps/_inbox/official/ano-calculator-skill-app_v0.1.2.zip
          test -f apps/_inbox/official/ano-tiandao-furnace-skill-app_v0.4.0.zip
          test -f apps/_inbox/official/ano-novel-skill-app_v0.3.1.zip

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request'
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out main release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          file_version = Path("VERSION").read_text(encoding="utf-8").strip()
          requested = os.environ.get("REQUESTED_VERSION", "").strip().removeprefix("v")
          version = requested or file_version
          if version != file_version:
              raise SystemExit(f"Requested version {version} does not match VERSION {file_version}")

          manifest = json.loads(Path("PACKAGE_MANIFEST.json").read_text(encoding="utf-8"))
          if manifest.get("version") != version:
              raise SystemExit("PACKAGE_MANIFEST.json version does not match VERSION")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"tag=v{version}\n")
              fh.write(f"title=Agent-Native OS v{version} — Governed Runtime for Long-Running AI Agents\n")
          PY

      - name: Check whether publishing is needed
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REFRESH_EXISTING: ${{ github.event.inputs.refresh_existing_release }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$REFRESH_EXISTING" != "false" ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "release_exists=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        if: steps.release-state.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^##\s+v?{re.escape(version)}(?:\s+.*)?$", re.MULTILINE)
          match = heading.search(changelog)
          if not match:
              raise SystemExit(f"No CHANGELOG section found for {version}")

          next_heading = re.search(r"^##\s+", changelog[match.end():], re.MULTILINE)
          end = match.end() + next_heading.start() if next_heading else len(changelog)
          section = changelog[match.end():end].strip()
          notes = (
              "> Experimental reference release for architecture evaluation, Skill App development, "
              "and reproducible Agent runtime experiments.\n\n"
              + section
              + "\n"
          )
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish or refresh Release
        if: steps.release-state.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          RELEASE_EXISTS: ${{ steps.release-state.outputs.release_exists }}
        run: |
          mapfile -t ASSETS < <(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("PACKAGE_MANIFEST.json").read_text(encoding="utf-8"))
          for package in manifest["bundled_app_packages"]:
              print(package["path"])
          print("PACKAGE_MANIFEST.json")
          PY
          )

          if [ "$RELEASE_EXISTS" = "true" ]; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              "${ASSETS[@]}"
          fi

      - name: Write workflow summary
        run: |
          if [ "${{ steps.release-state.outputs.should_release }}" = "true" ]; then
            echo "Published or refreshed **${{ steps.meta.outputs.tag }}** with official Skill App packages." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release **${{ steps.meta.outputs.tag }}** already exists; automatic push run skipped it." >> "$GITHUB_STEP_SUMMARY"
            echo "Use **Run workflow** with refresh enabled to rebuild its notes and assets." >> "$GITHUB_STEP_SUMMARY"
          fi
